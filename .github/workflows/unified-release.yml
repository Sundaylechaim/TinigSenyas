name: Unified Android & iOS Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  APP_NAME: "TinigSenyas"
  BUNDLE_ID: "com.tinigsenyas.app"
  DEVELOPER: "Sundaylechaim"

jobs:
  # -------------------------------------------------------------
  # Job 0a: Frontend gate - static analysis and tests
  # -------------------------------------------------------------
  test-frontend:
    name: Test Flutter App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Run Tests
        working-directory: frontend
        run: flutter test

  # -------------------------------------------------------------
  # Job 0b: Backend gate - installable dependencies and tests
  # -------------------------------------------------------------
  test-backend:
    name: Test Python Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # mediapipe publishes no cp313 wheel for the pinned range, so 3.12 is the ceiling.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Tests
        working-directory: backend
        run: python -m unittest discover -s . -p "test_*.py"

  # -------------------------------------------------------------
  # Job 1: Build Android APK
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      # Keep the private signing material in GitHub Actions secrets. Refuse to
      # produce any distributable APK when a required secret is missing.
      - name: Configure Android release signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = (
              "ANDROID_RELEASE_KEYSTORE_BASE64",
              "ANDROID_RELEASE_STORE_PASSWORD",
              "ANDROID_RELEASE_KEY_ALIAS",
              "ANDROID_RELEASE_KEY_PASSWORD",
              "SHOREBIRD_TOKEN",
          )
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Missing Android signing or Shorebird secrets: " + ", ".join(missing)
              )

          keystore = base64.b64decode(
              os.environ["ANDROID_RELEASE_KEYSTORE_BASE64"], validate=True
          )
          if not keystore:
              raise SystemExit("ANDROID_RELEASE_KEYSTORE_BASE64 decoded to an empty file")
          android_dir = Path("frontend/android")
          key_file = android_dir / "release-key.jks"
          key_file.write_bytes(keystore)
          key_file.chmod(0o600)

          def escape_property(value):
              escaped = []
              for index, char in enumerate(value):
                  code = ord(char)
                  if char == "\\":
                      escaped.append("\\\\")
                  elif char in "\t\n\r\f":
                      escaped.append({"\t": "\\t", "\n": "\\n", "\r": "\\r", "\f": "\\f"}[char])
                  elif char in "=:#!" or (char == " " and index == 0):
                      escaped.append("\\" + char)
                  elif code < 0x20 or code > 0x7e:
                      if code <= 0xffff:
                          escaped.append(f"\\u{code:04x}")
                      else:
                          code -= 0x10000
                          escaped.append(f"\\u{0xd800 + (code >> 10):04x}")
                          escaped.append(f"\\u{0xdc00 + (code & 0x3ff):04x}")
                  else:
                      escaped.append(char)
              return "".join(escaped)

          properties = {
              "storeFile": "../release-key.jks",
              "storePassword": os.environ["ANDROID_RELEASE_STORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_RELEASE_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_RELEASE_KEY_PASSWORD"],
          }
          key_properties = android_dir / "key.properties"
          key_properties.write_text(
              "".join(
                  f"{key}={escape_property(value)}\n"
                  for key, value in properties.items()
              ),
              encoding="ascii",
          )
          key_properties.chmod(0o600)
          PY

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # Publish a Shorebird baseline so future Dart-only updates can reach
      # this exact signed app release through the Shorebird patch workflow.
      - name: Build Shorebird-enabled signed ARM64 release APK
        working-directory: frontend
        run: shorebird release android --artifact apk --target-platform=android-arm64 --flutter-version=3.47.9 --release-version=1.0.0+2019

      - name: Verify release APK signature and certificate
        env:
          EXPECTED_SIGNER_SHA256: bb4cdeacb147b3d7e6395bf7aa59c56a5e631da1be03cd52125f0edd3a3d6e70
        run: |
          set -euo pipefail
          apk="frontend/build/app/outputs/flutter-apk/app-release.apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          signature_output=$("$apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$signature_output"
          printf '%s\n' "$signature_output" | grep -Fq "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256"

      - name: Prepare Android Binaries
        run: |
          mkdir -p dist
          cp frontend/build/app/outputs/flutter-apk/app-release.apk dist/TinigSenyas-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: dist/*

  # -------------------------------------------------------------
  # Job 2: Build iOS IPA & Simulator Build (unmac)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS IPA (Cloud Mac)
    needs: [test-frontend, test-backend]
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Release build (unsigned)
        working-directory: frontend
        run: flutter build ios --release --no-codesign

      - name: Package TinigSenyas-iOS.ipa
        run: |
          mkdir -p out/Payload
          cp -R frontend/build/ios/iphoneos/Runner.app out/Payload/
          (cd out && zip -qry "$GITHUB_WORKSPACE/TinigSenyas-iOS.ipa" Payload)

      - name: Simulator build for Appetize (debug)
        continue-on-error: true
        run: |
          cd frontend
          flutter build ios --simulator --debug
          (cd build/ios/iphonesimulator && zip -qry "$GITHUB_WORKSPACE/TinigSenyas-iOS-Simulator.zip" Runner.app)

      - name: Generate AltStore / SideStore source.json
        run: |
          python3 - <<'EOF'
          import datetime, json, os
          tag = os.environ.get("GITHUB_REF_NAME", "v1.0.0")
          repo = os.environ["GITHUB_REPOSITORY"]
          ipa_path = os.path.join(os.environ["GITHUB_WORKSPACE"], "TinigSenyas-iOS.ipa")
          ipa_size = os.path.getsize(ipa_path) if os.path.exists(ipa_path) else 0
          source = {
              "name": os.environ["APP_NAME"],
              "nsfw": False,
              "apps": [{
                  "name": os.environ["APP_NAME"],
                  "bundleIdentifier": os.environ["BUNDLE_ID"],
                  "developerName": os.environ["DEVELOPER"],
                  "localizedDescription": os.environ["APP_NAME"],
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/HEAD/frontend/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png",
                  "versions": [{
                      "version": tag.lstrip("v"),
                      "buildVersion": os.environ.get("GITHUB_RUN_NUMBER", "1"),
                      "date": datetime.date.today().isoformat(),
                      "downloadURL": f"https://github.com/{repo}/releases/download/{tag}/TinigSenyas-iOS.ipa",
                      "size": ipa_size,
                  }],
                  "appPermissions": {"entitlements": [], "privacy": {}},
              }],
          }
          json.dump(source, open(os.path.join(os.environ["GITHUB_WORKSPACE"], "source.json"), "w"), indent=2)
          EOF

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-dist
          path: |
            TinigSenyas-iOS.ipa
            TinigSenyas-iOS-Simulator.zip
            source.json

  # -------------------------------------------------------------
  # Job 3: Unified Release (Bundles both Android & iOS together)
  # -------------------------------------------------------------
  publish-unified-release:
    name: Publish Unified Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-dist
          path: release_assets

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-dist
          path: release_assets

      - name: Add complete OTA model bundle
        run: |
          set -euo pipefail
          model_dir=frontend/assets/model
          for asset in \
            fsl_model.tflite \
            fsl_alphabet.tflite \
            fsl_medical.tflite \
            labels.txt \
            medical_labels.txt \
            alphabet_labels.txt \
            manifest.json \
            version.txt; do
            test -s "$model_dir/$asset"
            cp "$model_dir/$asset" "release_assets/$asset"
          done
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("release_assets/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          required = {
              "fsl_model.tflite",
              "fsl_alphabet.tflite",
              "fsl_medical.tflite",
              "labels.txt",
              "medical_labels.txt",
              "alphabet_labels.txt",
          }
          entries = manifest.get("models", [])
          assets = {entry.get("name") for entry in entries if isinstance(entry, dict)}
          if assets != required:
              raise SystemExit(f"Manifest file set mismatch: {sorted(assets)}")
          for entry in entries:
              asset = Path("release_assets") / entry["name"]
              digest = hashlib.sha256(asset.read_bytes()).hexdigest()
              if digest != entry.get("sha256", "").lower():
                  raise SystemExit(f"Manifest SHA-256 mismatch: {asset.name}")
          if manifest.get("version") != Path("release_assets/version.txt").read_text().strip():
              raise SystemExit("Model version.txt does not match manifest version")
          PY

      - name: Generate Release Body
        run: |
          cat << 'EOF' > release_body.md
          # TinigSenyas Mobile App Release

          Choose your platform below to download and install TinigSenyas:

          ---

          ### FSL recognition models
          - App release baseline: **1.0.0+2019**. Recognition model bundle **1.3.0** is a separately versioned six-file set with checksums and an app-build compatibility floor.
          - Install this Shorebird-enabled APK baseline once. Future Dart-only changes can arrive as Shorebird patches; model weights use the in-app model updater.
          - The connected ST-GCN candidate showed a modest gain on an internal sample-level split; signer-independent Deaf-user validation is still needed.

          ---

          ### 📱 Android Users
          - **Download:** [`TinigSenyas-Android.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TinigSenyas-Android.apk)
          - **Installation:**
            1. Tap the link above on your Android phone to download.
            2. Open the downloaded `.apk` file.
            3. If prompted, allow **"Install unknown apps"** in Settings.
            4. If Google Play Protect asks, select **"More details" -> "Install anyway"**.

          ---

          ### 🍎 iOS / iPhone Users
          - **Download:** [`TinigSenyas-iOS.ipa`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TinigSenyas-iOS.ipa)
          - **Option 1 (Physical iPhone via Sideloadly - 100% Free):**
            1. Download [Sideloadly](https://sideloadly.io) on your PC/Mac.
            2. Connect your iPhone via USB cable and tap **Trust**.
            3. Drag `TinigSenyas-iOS.ipa` into Sideloadly, enter your free Apple ID, and click **Start**.
            4. On iPhone: Go to **Settings -> General -> VPN & Device Management** and tap **Trust**.
          - **Option 2 (Instant Browser Testing - No iPhone Required):**
            1. Download [`TinigSenyas-iOS-Simulator.zip`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TinigSenyas-iOS-Simulator.zip).
            2. Upload to [Appetize.io](https://appetize.io) to run the iOS app directly in your web browser.
          - **Option 3 (AltStore / SideStore):** Add [`source.json`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/source.json) as a custom source.
          EOF

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            release_assets/TinigSenyas-Android.apk
            release_assets/TinigSenyas-iOS.ipa
            release_assets/fsl_model.tflite
            release_assets/fsl_alphabet.tflite
            release_assets/fsl_medical.tflite
            release_assets/labels.txt
            release_assets/medical_labels.txt
            release_assets/alphabet_labels.txt
            release_assets/manifest.json
            release_assets/version.txt
          fail_on_unmatched_files: true

      - name: Upload Unified Package (on workflow_dispatch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: TinigSenyas-Universal-Package
          path: release_assets/*

