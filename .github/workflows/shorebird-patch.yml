name: Shorebird OTA Patch

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact Shorebird release installed by users
        required: true
        default: 1.2.14+17
        type: string
      track:
        description: Shorebird delivery track
        required: true
        default: staging
        type: choice
        options:
          - staging
          - stable

permissions:
  contents: read

jobs:
  patch-android:
    name: Publish Android OTA patch
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check OTA and Android signing secrets
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SHOREBIRD_TOKEN" ]] || missing+=(SHOREBIRD_TOKEN)
          [[ -n "$ANDROID_RELEASE_KEYSTORE_BASE64" ]] || missing+=(ANDROID_RELEASE_KEYSTORE_BASE64)
          [[ -n "$ANDROID_RELEASE_STORE_PASSWORD" ]] || missing+=(ANDROID_RELEASE_STORE_PASSWORD)
          [[ -n "$ANDROID_RELEASE_KEY_ALIAS" ]] || missing+=(ANDROID_RELEASE_KEY_ALIAS)
          [[ -n "$ANDROID_RELEASE_KEY_PASSWORD" ]] || missing+=(ANDROID_RELEASE_KEY_PASSWORD)
          if ((${#missing[@]})); then
            printf 'Configure these GitHub Actions repository secrets before publishing: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android release signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = (
              "ANDROID_RELEASE_KEYSTORE_BASE64",
              "ANDROID_RELEASE_STORE_PASSWORD",
              "ANDROID_RELEASE_KEY_ALIAS",
              "ANDROID_RELEASE_KEY_PASSWORD",
          )
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing Android release signing secrets: " + ", ".join(missing))

          android_dir = Path("frontend/android")
          keystore_path = android_dir / "release-key.jks"
          keystore_path.write_bytes(base64.b64decode(os.environ[names[0]], validate=True))
          keystore_path.chmod(0o600)

          def escape_property(value):
              escaped = []
              for index, char in enumerate(value):
                  code = ord(char)
                  if char == "\\":
                      escaped.append("\\\\")
                  elif char in "\t\n\r\f":
                      escaped.append({"\t": "\\t", "\n": "\\n", "\r": "\\r", "\f": "\\f"}[char])
                  elif char in "=:#!" or (char == " " and index == 0):
                      escaped.append("\\" + char)
                  elif code < 0x20 or code > 0x7e:
                      if code <= 0xffff:
                          escaped.append(f"\\u{code:04x}")
                      else:
                          code -= 0x10000
                          escaped.append(f"\\u{0xd800 + (code >> 10):04x}")
                          escaped.append(f"\\u{0xdc00 + (code & 0x3ff):04x}")
                  else:
                      escaped.append(char)
              return "".join(escaped)

          properties = {
              "storeFile": "../release-key.jks",
              "storePassword": os.environ[names[1]],
              "keyAlias": os.environ[names[2]],
              "keyPassword": os.environ[names[3]],
          }
          key_properties = android_dir / "key.properties"
          key_properties.write_text(
              "".join(f"{key}={escape_property(value)}\n" for key, value in properties.items()),
              encoding="ascii",
          )
          key_properties.chmod(0o600)
          PY

      - name: Publish Shorebird patch
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: ${{ inputs.release_version }}
          track: ${{ inputs.track }}
          working-directory: frontend
          args: --target-platform=android-arm64
